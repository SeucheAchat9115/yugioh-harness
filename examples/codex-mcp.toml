# Generate usable paths with: yugioh-harness host-config --host codex --repo <checkout>
# Replace every placeholder. Installed Python makes cwd unnecessary.
[mcp_servers.yugioh]
command = "/absolute/path/to/checkout/.venv/bin/python"
args = ["-m", "harness.integration.mcp", "--repo", "/absolute/path/to/checkout"]
startup_timeout_sec = 10
tool_timeout_sec = 30
