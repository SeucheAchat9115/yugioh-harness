# One-time host configuration, installed by the orchestrator or host administrator.
# No per-duel setup, private-state paths, or player sessions are required.
[mcp_servers.yugioh]
command = "python"
args = ["-m", "harness.integration.mcp", "--repo", "/workspace/yugioh-harness"]
cwd = "/workspace/yugioh-harness"
startup_timeout_sec = 10
tool_timeout_sec = 30
