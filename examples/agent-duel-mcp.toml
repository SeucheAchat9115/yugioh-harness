# Optional host-managed multi-process deployment reference.
# Normal duels use one orchestrator and examples/codex-mcp.toml.
# Use exactly ONE block per independent Codex session. Replace credential/cwd paths.
# Keep the arena running in a separate process; gateways do not start another runner.
[mcp_servers.yugioh_player_1]
command = "/absolute/path/to/checkout/.venv/bin/python"
args = ["-m", "harness.integration.mcp", "--credential", "/absolute/path/to/arena-private/agents-001/player_1.json"]
cwd = "/absolute/path/to/checkout"

[mcp_servers.yugioh_player_2]
command = "/absolute/path/to/checkout/.venv/bin/python"
args = ["-m", "harness.integration.mcp", "--credential", "/absolute/path/to/arena-private/agents-001/player_2.json"]
cwd = "/absolute/path/to/checkout"

[mcp_servers.yugioh_moderator]
command = "/absolute/path/to/checkout/.venv/bin/python"
args = ["-m", "harness.integration.mcp", "--credential", "/absolute/path/to/arena-private/agents-001/moderator.json"]
cwd = "/absolute/path/to/checkout"
