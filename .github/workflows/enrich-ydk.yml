name: Enrich YDK decks

on:
  push:
    branches: [main]
    paths:
      - 'decks/**/*.ydk'
      - 'skills/ydk-to-json/**'
      - '.github/workflows/enrich-ydk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich-ydk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test converter
        run: python -m unittest discover -s skills/ydk-to-json/tests -v
      - name: Fetch card data and generate gameplay-only JSON
        run: python skills/ydk-to-json/scripts/convert.py --repo .
      - name: Commit enriched JSON files
        shell: bash
        run: |
          git add -- decks
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Convert YDK decks to gameplay-only JSON'
          git push
