name: Test duel harness

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'harness/**'
      - 'tests/**'
      - 'templates/**'
      - '.github/workflows/duel-agents.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'harness/**'
      - 'tests/**'
      - 'templates/**'
      - '.github/workflows/duel-agents.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
